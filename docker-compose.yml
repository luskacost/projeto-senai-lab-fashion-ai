# Fase 9/Bloco C: substitui o docker-compose.yml antigo, que só subia o container Streamlit
# descontinuado. Agora sobe os dois serviços da arquitetura atual: backend (FastAPI) + frontend
# (Next.js). Ver README.md para instruções de deploy e frontend/Dockerfile para a observação
# importante sobre NEXT_PUBLIC_API_URL (precisa ser a URL pública alcançável pelo navegador).
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./tenant_data:/app/tenant_data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      # Lista separada por vírgula das origens que podem chamar a API (ver api/main.py) --
      # default cobre só desenvolvimento local. Sobrepõe o que estiver em .env se ambos definirem.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID:-senai_labfashion}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
