# docker-compose.prod.yml -- deploy em produção (VPS + Coolify, Fase A).
#
# Arquivo separado do docker-compose.yml (uso local) porque o formato de rede, armazenamento e
# segredos é propositalmente diferente, não só os valores:
#
# - Nenhum `ports:` publicado: backend e frontend só são alcançáveis pela rede interna que o
#   Compose cria. O reverse proxy do Coolify entra nessa mesma rede e alcança os dois serviços
#   pelo nome -- sem porta publicada no host, ninguém de fora consegue bater direto em IP:porta
#   pulando o HTTPS, e evita o `/documentos/upload` e o `/chat` ficarem alcançáveis sem o domínio.
# - Volumes NOMEADOS em vez de bind mount (`./tenant_data:/app/tenant_data`, como no arquivo
#   local): o Coolify clona o repositório do zero a cada deploy -- um bind mount apontaria pra um
#   diretório que não existe (ou que é recriado vazio) no clone novo. Um volume nomeado sobrevive
#   a qualquer número de deploys, porque não depende do checkout do git.
# - `--proxy-headers --forwarded-allow-ips='*'` no uvicorn: sem isso, toda requisição que passa
#   pelo proxy chega ao backend com o MESMO IP (o do proxy, não o do usuário real) -- o bloqueio de
#   login após 5 tentativas erradas (Fase 14) e o limite de requisições por IP (Fase 16, D1)
#   passariam a valer pra todo mundo ao mesmo tempo, não por pessoa: uma consultora errando a
#   senha 5 vezes bloquearia a outra também. `'*'` confia no cabeçalho X-Forwarded-For de
#   qualquer origem -- seguro aqui especificamente porque não existe OUTRO caminho até o backend
#   além do proxy (sem porta publicada, nada mais alcança o contêiner pra forjar esse cabeçalho).
# - Segredos vêm das variáveis de ambiente de quem invoca `docker compose` (o próprio Coolify,
#   preenchidas no painel dele) -- não existe `.env` no servidor. `${VAR:?mensagem}` faz o deploy
#   falhar com uma mensagem clara em vez de subir silenciosamente com uma string vazia; o nome
#   solto (`- NOME_DA_VARIAVEL`, sem `=`) repassa o valor se ele existir e não faz nada se não
#   existir -- usado nos segredos opcionais (login/admin por tenant, Fase 16).
#
# Adicionar um tenant novo (Fase 16, L7): além de `tenant_config.py` e das variáveis no painel do
# Coolify, acrescentar aqui as duas linhas de `{TENANT_ID}_LOGIN_SENHA`/`{TENANT_ID}_ADMIN_PASSWORD`
# dele na lista de `environment:` do backend -- sem a linha aqui, o valor não chega ao contêiner
# mesmo que esteja configurado no painel.
services:
  backend:
    build: .
    expose:
      - "8000"
    volumes:
      - tenant_data:/app/tenant_data
      - logs:/app/logs
    environment:
      - AMBIENTE=producao
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?defina com a URL https do frontend, ex. https://app.seudominio.com}
      - SENAI_LABFASHION_OPENAI_API_KEY=${SENAI_LABFASHION_OPENAI_API_KEY:?defina a chave da OpenAI}
      - SENAI_LABFASHION_LOGIN_SENHA
      - SENAI_LABFASHION_ADMIN_PASSWORD
      - CONSULTOR_MORGANA_LOGIN_SENHA
      - CONSULTOR_MORGANA_ADMIN_PASSWORD
      - CONSULTOR_ISABELLA_LOGIN_SENHA
      - CONSULTOR_ISABELLA_ADMIN_PASSWORD
      - LOG_LEVEL
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina com a URL https do backend, ex. https://api.seudominio.com}
        NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID:-senai_labfashion}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  tenant_data:
  logs:
